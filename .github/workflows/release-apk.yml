name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (created on the selected branch if it does not exist)
        required: false
      warm_cache:
        description: Warm build caches on main without publishing a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      EXPO_PUBLIC_API_MODE: server
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the tag
        shell: bash
        run: |
          if [ "${{ inputs.warm_cache }}" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Select main to warm caches for future tag builds"; exit 1
            fi
            exit 0
          fi
          if [ -z "$TAG" ]; then
            echo "::error::A tag is required when not warming caches"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout --detach "refs/tags/$TAG"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::Tag $TAG not found"; exit 1
          else
            echo "Tag $TAG does not exist yet; it will be created at $(git rev-parse HEAD)."
          fi
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-ccache-${{ runner.os }}-arm64-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-ccache-${{ runner.os }}-arm64-${{ hashFiles('package-lock.json') }}-
            android-ccache-${{ runner.os }}-arm64-
      - run: npm install -g npm@^11.8
      - run: npm ci
      - run: npm run build:packages

      - name: Set the app version from the tag
        if: ${{ !inputs.warm_cache }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/mobile/app.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            const version = process.env.TAG.replace(/^v/, "");
            config.expo.version = version.split("-")[0];
            config.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER) + 100;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
            console.log(`version ${config.expo.version} (${config.expo.android.versionCode}), API ${process.env.EXPO_PUBLIC_API_URL || "set in the app"}`);
          '

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            signing=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with the shared Expo debug key."
          fi
          ./gradlew assembleRelease --no-daemon --build-cache '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' -PreactNativeArchitectures=arm64-v8a "${signing[@]}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/transit-agent.apk"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.warm_cache }}
        with:
          name: transit-agent-${{ env.TAG }}
          path: ${{ runner.temp }}/transit-agent.apk
          retention-days: 14

      - name: Publish the GitHub release
        if: ${{ !inputs.warm_cache }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          [[ "$TAG" == *-* ]] && extra+=(--prerelease)
          if [ "$TAG_EXISTS" = true ]; then extra+=(--verify-tag); else extra+=(--target "$BUILD_SHA"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/transit-agent.apk" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/transit-agent.apk" --title "Transit Agent $TAG" --generate-notes "${extra[@]}"
          fi
